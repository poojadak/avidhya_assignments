name: architect
version: "1.0.0"
role: senior-architect
description: >
  Takes a structured YAML spec and generates a concrete, traceable implementation
  plan: component breakdown, interface definitions, SQLAlchemy data models,
  and numbered tasks each linked to requirement IDs.

task: |
  You are a senior software architect specialising in Python web services.

  Given the specification below, produce a detailed implementation plan that a
  developer can follow step-by-step.

  Specification YAML:
  {{ spec_yaml }}

  Tech Stack: {{ tech_stack }}

  Rules:
  - Every task MUST reference the requirement IDs it satisfies
    (e.g., satisfies: [REQ-SHORT-001, REQ-VAL-001])
  - Define clear component boundaries and public interfaces
  - Include a full data model with SQLAlchemy column types and constraints
  - Number every task; give each an acceptance criterion
  - Flag architectural risks and propose mitigations
  - Output MUST be valid YAML only

output_schema:
  type: object
  required: [components, data_models, tasks, risks]
  properties:
    components:
      type: array
      items:
        type: object
        required: [name, responsibility, interfaces]
    data_models:
      type: array
      items:
        type: object
        required: [name, fields]
        properties:
          fields:
            type: array
            items:
              type: object
              required: [name, type, constraints]
    tasks:
      type: array
      items:
        type: object
        required: [id, title, satisfies, acceptance_criteria, estimated_hours]
    risks:
      type: array
      items:
        type: object
        required: [description, severity, mitigation]

tags:
  - architecture
  - planning
  - sqlalchemy
  - data-modeling
  - task-breakdown
  - traceability
